openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stocks
    description: Stock data operations
  - name: alerts
    description: Market intelligence alert operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /stocks/{ticker}:
    get:
      operationId: getStockData
      tags: [stocks]
      summary: Get live stock data
      description: Returns ticker, market cap, P/E ratio, quarterly report, upcoming events, and AI summary
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stock data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockData"
        "404":
          description: Stock not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stocks/{ticker}/summary:
    get:
      operationId: getStockSummary
      tags: [stocks]
      summary: Get AI-generated stock summary
      description: Returns an AI-generated brief analysis of the stock
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockSummary"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stocks/{ticker}/profile:
    get:
      operationId: getStockProfile
      tags: [stocks]
      summary: Get company profile and specialization context
      description: Returns supplier-backed company profile data, a confidence-aware specialization summary, and extracted business agreements
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
        "400":
          description: Invalid ticker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stocks/{ticker}/history:
    get:
      operationId: getStockHistory
      tags: [stocks]
      summary: Get stock price history
      description: Returns historical price data for charting
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: ["1d", "5d", "1mo", "3mo", "6mo", "1y"]
            default: "1mo"
      responses:
        "200":
          description: Historical price data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockHistory"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stocks/{ticker}/analytics:
    get:
      operationId: getStockAnalytics
      tags: [stocks]
      summary: Get stock fundamentals, returns, and completed weekly candles
      description: Returns valuation and cash-flow metrics, period returns, and the latest completed trading week with daily and weekly OHLCV candles
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stock analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockAnalytics"
        "404":
          description: Stock not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stocks/watchlist/check:
    post:
      operationId: checkWatchlist
      tags: [stocks]
      summary: Check watchlist for new earnings reports or upcoming events
      description: Given a list of watched tickers and their last known report dates, returns alerts for any new reports published or upcoming earnings within 7 days
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistCheckRequest"
      responses:
        "200":
          description: Watchlist alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistCheckResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stocks/{ticker}/daily-analysis:
    get:
      operationId: getStockDailyAnalysis
      tags: [stocks]
      summary: Get daily AI analysis for a stock
      description: Returns real-time daily analysis — what is moving the stock, buyer/seller pressure, analyst consensus
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Daily analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyAnalysis"
        "404":
          description: Stock not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stocks/{ticker}/deep-analysis:
    get:
      operationId: getStockDeepAnalysis
      tags: [stocks]
      summary: Get deep AI analysis based on hedge fund frameworks
      description: Returns a structured multi-layer analysis using hedge fund analyst frameworks — company positioning, competitive moat, value capture, catalysts, and more
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deep analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepAnalysis"
        "404":
          description: Stock not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market/daily-report:
    get:
      operationId: getMarketDailyReport
      tags: [market]
      summary: Get daily market overview with sector flows and AI analysis
      description: Returns real-time sector ETF performance, major indices, capital flow analysis, and AI-generated market pulse
      responses:
        "200":
          description: Market daily report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDailyReport"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /economy/calendar:
    get:
      operationId: getEconomicCalendar
      tags: [market]
      summary: Get important U.S. and Israeli economic releases from Investing.com
      description: Returns medium- and high-impact economic calendar events published by Investing.com, including recent results and upcoming consensus expectations.
      responses:
        "200":
          description: Economic calendar events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomicCalendarResponse"
        "502":
          description: Investing.com data is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sectors/signals:
    get:
      operationId: getSectorSignals
      tags: [market]
      summary: Scan completed daily or weekly candles for a signal
      description: Returns stocks matching a candle signal. Daily hammer scans use the latest completed trading session before the exchange-local current date; pass sector=all for a market-wide scan.
      parameters:
        - name: sector
          in: query
          required: false
          schema:
            type: string
            default: Technology
        - name: signal
          in: query
          required: false
          schema:
            type: string
            enum: [hammer_daily, hammer_weekly]
            default: hammer_weekly
      responses:
        "200":
          description: Candle signal scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectorSignalResponse"
        "400":
          description: Invalid sector or signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alerts/article-metadata:
    post:
      operationId: fetchArticleMetadata
      tags: [alerts]
      summary: Read public article metadata from a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleMetadataRequest"
      responses:
        "200":
          description: Extracted article metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleMetadata"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Article metadata could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alerts/scan:
    post:
      operationId: scanMarketAlerts
      tags: [alerts]
      summary: Scan tracked stocks and sectors for new market signals
      description: Reads the configured news and social sources and returns positive or negative items for tracked stocks and their sectors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketAlertScanRequest"
      responses:
        "200":
          description: Market intelligence alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketAlertScanResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    StockData:
      type: object
      properties:
        ticker:
          type: string
        companyName:
          type: string
        price:
          type: number
        priceChange:
          type: number
        priceChangePercent:
          type: number
        marketCap:
          type: number
        marketCapFormatted:
          type: string
        peRatio:
          type: number
          nullable: true
        eps:
          type: number
          nullable: true
        quarterlyReport:
          $ref: "#/components/schemas/QuarterlyReport"
        upcomingEvents:
          type: array
          items:
            $ref: "#/components/schemas/StockEvent"
        currency:
          type: string
        exchange:
          type: string
        sector:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        aiSummary:
          type: string
          nullable: true
        marketState:
          type: string
          enum: ["PRE", "REGULAR", "POST", "POSTPOST", "PREPRE", "CLOSED"]
          nullable: true
        preMarketPrice:
          type: number
          nullable: true
        preMarketChangePercent:
          type: number
          nullable: true
        postMarketPrice:
          type: number
          nullable: true
        postMarketChangePercent:
          type: number
          nullable: true
        regularMarketTime:
          type: string
          nullable: true
          description: ISO timestamp of the last market price update from exchange
        fetchedAt:
          type: string
          description: ISO timestamp of when the server fetched this data
        volume:
          type: number
          nullable: true
        averageVolume:
          type: number
          nullable: true
        dayHigh:
          type: number
          nullable: true
        dayLow:
          type: number
          nullable: true
        fiftyTwoWeekHigh:
          type: number
          nullable: true
        fiftyTwoWeekLow:
          type: number
          nullable: true
        bid:
          type: number
          nullable: true
        ask:
          type: number
          nullable: true
        dividendYield:
          type: number
          nullable: true
      required:
        - ticker
        - companyName
        - price
        - priceChange
        - priceChangePercent
        - marketCap
        - marketCapFormatted
        - quarterlyReport
        - upcomingEvents
        - currency
        - exchange
        - fetchedAt

    QuarterlyReport:
      type: object
      properties:
        period:
          type: string
        revenue:
          type: number
          nullable: true
        revenueFormatted:
          type: string
          nullable: true
        netIncome:
          type: number
          nullable: true
        netIncomeFormatted:
          type: string
          nullable: true
        eps:
          type: number
          nullable: true
        revenueGrowth:
          type: number
          nullable: true
        reportDate:
          type: string
          nullable: true
      required:
        - period

    StockEvent:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
        type:
          type: string
          enum: ["earnings", "dividend", "conference", "other"]
        description:
          type: string
          nullable: true
      required:
        - title
        - date
        - type

    StockSummary:
      type: object
      properties:
        ticker:
          type: string
        summary:
          type: string
        generatedAt:
          type: string
      required:
        - ticker
        - summary
        - generatedAt

    CompanyAgreement:
      type: object
      properties:
        type:
          type: string
        partner:
          type: string
          nullable: true
        description:
          type: string
      required:
        - type
        - partner
        - description

    CompanySpecializationStatus:
      type: string
      enum: ["available", "insufficient_data", "unavailable"]

    CompanySpecializationConfidence:
      type: string
      enum: ["high", "medium", "low", "unknown"]

    CompanySpecialization:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/CompanySpecializationStatus"
        primaryProduct:
          type: string
          nullable: true
        offerings:
          type: array
          items:
            type: string
        customerMarkets:
          type: array
          items:
            type: string
        keywords:
          type: array
          items:
            type: string
        confidence:
          $ref: "#/components/schemas/CompanySpecializationConfidence"
        source:
          type: string
          nullable: true
        generatedAt:
          type: string
          nullable: true
      required:
        - status
        - primaryProduct
        - offerings
        - customerMarkets
        - keywords
        - confidence
        - source
        - generatedAt

    CompanyProfile:
      type: object
      properties:
        ticker:
          type: string
        companyName:
          type: string
        description:
          type: string
          nullable: true
        sector:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        employees:
          type: integer
          nullable: true
        agreements:
          type: array
          items:
            $ref: "#/components/schemas/CompanyAgreement"
        specialization:
          $ref: "#/components/schemas/CompanySpecialization"
        generatedAt:
          type: string
      required:
        - ticker
        - companyName
        - description
        - sector
        - industry
        - website
        - country
        - employees
        - agreements
        - specialization
        - generatedAt

    StockHistory:
      type: object
      properties:
        ticker:
          type: string
        period:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/PricePoint"
      required:
        - ticker
        - period
        - data

    StockAnalytics:
      type: object
      properties:
        ticker:
          type: string
        fetchedAt:
          type: string
        fundamentals:
          $ref: "#/components/schemas/StockFundamentals"
        returns:
          $ref: "#/components/schemas/StockReturns"
        latestCompletedWeek:
          $ref: "#/components/schemas/CompletedWeek"
          nullable: true
      required:
        - ticker
        - fetchedAt
        - fundamentals
        - returns
        - latestCompletedWeek

    StockFundamentals:
      type: object
      properties:
        shortFloat:
          type: number
          nullable: true
          description: Short interest as a fraction of float
        operatingCashFlow:
          type: number
          nullable: true
        freeCashFlow:
          type: number
          nullable: true
        trailingPE:
          type: number
          nullable: true
        forwardPE:
          type: number
          nullable: true
        fiftyTwoWeekHigh:
          type: number
          nullable: true
        fiftyTwoWeekLow:
          type: number
          nullable: true
      required:
        - shortFloat
        - operatingCashFlow
        - freeCashFlow
        - trailingPE
        - forwardPE
        - fiftyTwoWeekHigh
        - fiftyTwoWeekLow

    StockReturns:
      type: object
      properties:
        day:
          type: number
          nullable: true
        week:
          type: number
          nullable: true
        month:
          type: number
          nullable: true
        ytd:
          type: number
          nullable: true
        year:
          type: number
          nullable: true
      required:
        - day
        - week
        - month
        - ytd
        - year

    CompletedWeek:
      type: object
      properties:
        weekStart:
          type: string
        weekEnd:
          type: string
        dailyCandles:
          type: array
          items:
            $ref: "#/components/schemas/PricePoint"
        weeklyCandle:
          $ref: "#/components/schemas/PricePoint"
        averageDailyVolume:
          type: number
          nullable: true
        totalVolume:
          type: number
          nullable: true
        candlePattern:
          type: string
      required:
        - weekStart
        - weekEnd
        - dailyCandles
        - weeklyCandle
        - candlePattern

    PricePoint:
      type: object
      properties:
        date:
          type: string
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
      required:
        - date
        - close
        - volume

    DeepAnalysis:
      type: object
      properties:
        ticker:
          type: string
        companyName:
          type: string
        systemUnderstanding:
          $ref: "#/components/schemas/AnalysisSystemUnderstanding"
        companyPositioning:
          $ref: "#/components/schemas/AnalysisCompanyPositioning"
        managementAssessment:
          $ref: "#/components/schemas/AnalysisManagement"
          nullable: true
        marketSizing:
          $ref: "#/components/schemas/AnalysisMarketSizing"
          nullable: true
        competitiveAdvantage:
          $ref: "#/components/schemas/AnalysisCompetitiveAdvantage"
        valueCaptureQuality:
          $ref: "#/components/schemas/AnalysisValueCapture"
        financialDeepDive:
          $ref: "#/components/schemas/AnalysisFinancialDeepDive"
          nullable: true
        chainComparison:
          $ref: "#/components/schemas/AnalysisChainComparison"
        forwardLooking:
          $ref: "#/components/schemas/AnalysisForwardLooking"
        valuationDCF:
          $ref: "#/components/schemas/AnalysisValuationDCF"
          nullable: true
        conclusion:
          $ref: "#/components/schemas/AnalysisConclusion"
        eventAnalysis:
          $ref: "#/components/schemas/AnalysisEvent"
          nullable: true
        fiveYearForecast:
          type: string
          nullable: true
        kpiTracker:
          type: string
          nullable: true
        riskMatrix:
          $ref: "#/components/schemas/AnalysisRiskMatrix"
          nullable: true
        analystConsensus:
          $ref: "#/components/schemas/AnalystConsensus"
          nullable: true
        generatedAt:
          type: string
      required:
        - ticker
        - companyName
        - systemUnderstanding
        - companyPositioning
        - competitiveAdvantage
        - valueCaptureQuality
        - chainComparison
        - forwardLooking
        - conclusion
        - generatedAt

    AnalysisSystemUnderstanding:
      type: object
      properties:
        valueChain:
          type: string
        valueCreation:
          type: string
        bottlenecks:
          type: string
        macroTrends:
          type: string
      required:
        - valueChain
        - valueCreation
        - bottlenecks
        - macroTrends

    AnalysisCompanyPositioning:
      type: object
      properties:
        positionInChain:
          type: string
        functionalRole:
          type: string
        positionQuality:
          type: string
      required:
        - positionInChain
        - functionalRole
        - positionQuality

    AnalysisCompetitiveAdvantage:
      type: object
      properties:
        differentiation:
          type: string
        moat:
          type: string
        competitiveLandscape:
          type: string
      required:
        - differentiation
        - moat
        - competitiveLandscape

    AnalysisValueCapture:
      type: object
      properties:
        valueCapture:
          type: string
        revenueQuality:
          type: string
        warningSigns:
          type: string
      required:
        - valueCapture
        - revenueQuality
        - warningSigns

    AnalysisChainComparison:
      type: object
      properties:
        betterAlternatives:
          type: string
        relativePositioning:
          type: string
      required:
        - betterAlternatives
        - relativePositioning

    AnalysisForwardLooking:
      type: object
      properties:
        catalysts:
          type: string
        bullCase:
          type: string
        bearCase:
          type: string
        baseCase:
          type: string
        winConditions:
          type: string
      required:
        - catalysts
        - bullCase
        - bearCase
        - baseCase
        - winConditions

    AnalysisConclusion:
      type: object
      properties:
        classification:
          type: string
          enum: ["value_pool", "hype", "tactical", "value_trap"]
        classificationLabel:
          type: string
        reasoning:
          type: string
        actionableIdeas:
          type: string
      required:
        - classification
        - classificationLabel
        - reasoning
        - actionableIdeas

    AnalysisEvent:
      type: object
      properties:
        realityVsNarrative:
          type: string
        secondOrderThinking:
          type: string
        capitalFlow:
          type: string
        winners:
          type: string
        losers:
          type: string
        materiality:
          type: string
        actionableInsights:
          type: string
      required:
        - realityVsNarrative
        - secondOrderThinking
        - capitalFlow
        - winners
        - losers
        - materiality
        - actionableInsights

    AnalysisManagement:
      type: object
      properties:
        ceoProfile:
          type: string
        skinInGame:
          type: string
        trackRecord:
          type: string
      required:
        - ceoProfile
        - skinInGame
        - trackRecord

    AnalysisMarketSizing:
      type: object
      properties:
        tam:
          type: string
        cagr:
          type: string
        pricingPower:
          type: string
      required:
        - tam
        - cagr
        - pricingPower

    AnalysisFinancialDeepDive:
      type: object
      properties:
        roicVsWacc:
          type: string
        interestCoverageInsight:
          type: string
        capexQuality:
          type: string
        ebitdaToNetIncome:
          type: string
      required:
        - roicVsWacc
        - interestCoverageInsight
        - capexQuality
        - ebitdaToNetIncome

    AnalysisValuationDCF:
      type: object
      properties:
        bullDCF:
          type: string
        baseDCF:
          type: string
        bearDCF:
          type: string
        historicalMultiple:
          type: string
      required:
        - bullDCF
        - baseDCF
        - bearDCF
        - historicalMultiple

    AnalysisRiskMatrix:
      type: object
      properties:
        supplyChain:
          type: string
        preMortem:
          type: string
        thesisBreaker:
          type: string
      required:
        - supplyChain
        - preMortem
        - thesisBreaker

    SectorPerformanceItem:
      type: object
      properties:
        ticker:
          type: string
        name:
          type: string
        price:
          type: number
          nullable: true
        changePercent:
          type: number
          nullable: true
        change:
          type: number
          nullable: true
        volume:
          type: number
          nullable: true
        avgVolume:
          type: number
          nullable: true
        relativeVolume:
          type: number
          nullable: true
        fiftyTwoWeekHigh:
          type: number
          nullable: true
        fiftyTwoWeekLow:
          type: number
          nullable: true
        preMarketPrice:
          type: number
          nullable: true
        preMarketChangePercent:
          type: number
          nullable: true
        postMarketPrice:
          type: number
          nullable: true
        postMarketChangePercent:
          type: number

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stocks
    description: Stock data operations
  - name: alerts
    description: Market intelligence alert operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /stocks/{ticker}:
    get:
      operationId: getStockData
      tags: [stocks]
      summary: Get live stock data
      description: Returns ticker, market cap, P/E ratio, quarterly report, upcoming events, and AI summary
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stock data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockData"
        "404":
          description: Stock not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stocks/{ticker}/summary:
    get:
      operationId: getStockSummary
      tags: [stocks]
      summary: Get AI-generated stock summary
      description: Returns an AI-generated brief analysis of the stock
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: AI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockSummary"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stocks/{ticker}/history:
    get:
      operationId: getStockHistory
      tags: [stocks]
      summary: Get stock price history
      description: Returns historical price data for charting
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: ["1d", "5d", "1mo", "3mo", "6mo", "1y"]
            default: "1mo"
      responses:
        "200":
          description: Historical price data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockHistory"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stocks/watchlist/check:
    post:
      operationId: checkWatchlist
      tags: [stocks]
      summary: Check watchlist for new earnings reports or upcoming events
      description: Given a list of watched tickers and their last known report dates, returns alerts for any new reports published or upcoming earnings within 7 days
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistCheckRequest"
      responses:
        "200":
          description: Watchlist alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistCheckResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stocks/{ticker}/daily-analysis:
    get:
      operationId: getStockDailyAnalysis
      tags: [stocks]
      summary: Get daily AI analysis for a stock
      description: Returns real-time daily analysis — what is moving the stock, buyer/seller pressure, analyst consensus
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Daily analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyAnalysis"
        "404":
          description: Stock not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stocks/{ticker}/deep-analysis:
    get:
      operationId: getStockDeepAnalysis
      tags: [stocks]
      summary: Get deep AI analysis based on hedge fund frameworks
      description: Returns a structured multi-layer analysis using hedge fund analyst frameworks — company positioning, competitive moat, value capture, catalysts, and more
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deep analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepAnalysis"
        "404":
          description: Stock not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market/daily-report:
    get:
      operationId: getMarketDailyReport
      tags: [market]
      summary: Get daily market overview with sector flows and AI analysis
      description: Returns real-time sector ETF performance, major indices, capital flow analysis, and AI-generated market pulse
      responses:
        "200":
          description: Market daily report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDailyReport"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /alerts/scan:
    post:
      operationId: scanMarketAlerts
      tags: [alerts]
      summary: Scan tracked stocks and sectors for new market signals
      description: Reads the configured news and social sources and returns positive or negative items for tracked stocks and their sectors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketAlertScanRequest"
      responses:
        "200":
          description: Market intelligence alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketAlertScanResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    StockData:
      type: object
      properties:
        ticker:
          type: string
        companyName:
          type: string
        price:
          type: number
        priceChange:
          type: number
        priceChangePercent:
          type: number
        marketCap:
          type: number
        marketCapFormatted:
          type: string
        peRatio:
          type: number
          nullable: true
        eps:
          type: number
          nullable: true
        quarterlyReport:
          $ref: "#/components/schemas/QuarterlyReport"
        upcomingEvents:
          type: array
          items:
            $ref: "#/components/schemas/StockEvent"
        currency:
          type: string
        exchange:
          type: string
        sector:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        aiSummary:
          type: string
          nullable: true
        marketState:
          type: string
          enum: ["PRE", "REGULAR", "POST", "POSTPOST", "PREPRE", "CLOSED"]
          nullable: true
        preMarketPrice:
          type: number
          nullable: true
        preMarketChangePercent:
          type: number
          nullable: true
        postMarketPrice:
          type: number
          nullable: true
        postMarketChangePercent:
          type: number
          nullable: true
        regularMarketTime:
          type: string
          nullable: true
          description: ISO timestamp of the last market price update from exchange
        fetchedAt:
          type: string
          description: ISO timestamp of when the server fetched this data
        volume:
          type: number
          nullable: true
        averageVolume:
          type: number
          nullable: true
        dayHigh:
          type: number
          nullable: true
        dayLow:
          type: number
          nullable: true
        fiftyTwoWeekHigh:
          type: number
          nullable: true
        fiftyTwoWeekLow:
          type: number
          nullable: true
        bid:
          type: number
          nullable: true
        ask:
          type: number
          nullable: true
        dividendYield:
          type: number
          nullable: true
      required:
        - ticker
        - companyName
        - price
        - priceChange
        - priceChangePercent
        - marketCap
        - marketCapFormatted
        - quarterlyReport
        - upcomingEvents
        - currency
        - exchange
        - fetchedAt

    QuarterlyReport:
      type: object
      properties:
        period:
          type: string
        revenue:
          type: number
          nullable: true
        revenueFormatted:
          type: string
          nullable: true
        netIncome:
          type: number
          nullable: true
        netIncomeFormatted:
          type: string
          nullable: true
        eps:
          type: number
          nullable: true
        revenueGrowth:
          type: number
          nullable: true
        reportDate:
          type: string
          nullable: true
      required:
        - period

    StockEvent:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
        type:
          type: string
          enum: ["earnings", "dividend", "conference", "other"]
        description:
          type: string
          nullable: true
      required:
        - title
        - date
        - type

    StockSummary:
      type: object
      properties:
        ticker:
          type: string
        summary:
          type: string
        generatedAt:
          type: string
      required:
        - ticker
        - summary
        - generatedAt

    StockHistory:
      type: object
      properties:
        ticker:
          type: string
        period:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/PricePoint"
      required:
        - ticker
        - period
        - data

    PricePoint:
      type: object
      properties:
        date:
          type: string
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
      required:
        - date
        - close
        - volume

    DeepAnalysis:
      type: object
      properties:
        ticker:
          type: string
        companyName:
          type: string
        systemUnderstanding:
          $ref: "#/components/schemas/AnalysisSystemUnderstanding"
        companyPositioning:
          $ref: "#/components/schemas/AnalysisCompanyPositioning"
        managementAssessment:
          $ref: "#/components/schemas/AnalysisManagement"
          nullable: true
        marketSizing:
          $ref: "#/components/schemas/AnalysisMarketSizing"
          nullable: true
        competitiveAdvantage:
          $ref: "#/components/schemas/AnalysisCompetitiveAdvantage"
        valueCaptureQuality:
          $ref: "#/components/schemas/AnalysisValueCapture"
        financialDeepDive:
          $ref: "#/components/schemas/AnalysisFinancialDeepDive"
          nullable: true
        chainComparison:
          $ref: "#/components/schemas/AnalysisChainComparison"
        forwardLooking:
          $ref: "#/components/schemas/AnalysisForwardLooking"
        valuationDCF:
          $ref: "#/components/schemas/AnalysisValuationDCF"
          nullable: true
        conclusion:
          $ref: "#/components/schemas/AnalysisConclusion"
        eventAnalysis:
          $ref: "#/components/schemas/AnalysisEvent"
          nullable: true
        fiveYearForecast:
          type: string
          nullable: true
        kpiTracker:
          type: string
          nullable: true
        riskMatrix:
          $ref: "#/components/schemas/AnalysisRiskMatrix"
          nullable: true
        analystConsensus:
          $ref: "#/components/schemas/AnalystConsensus"
          nullable: true
        generatedAt:
          type: string
      required:
        - ticker
        - companyName
        - systemUnderstanding
        - companyPositioning
        - competitiveAdvantage
        - valueCaptureQuality
        - chainComparison
        - forwardLooking
        - conclusion
        - generatedAt

    AnalysisSystemUnderstanding:
      type: object
      properties:
        valueChain:
          type: string
        valueCreation:
          type: string
        bottlenecks:
          type: string
        macroTrends:
          type: string
      required:
        - valueChain
        - valueCreation
        - bottlenecks
        - macroTrends

    AnalysisCompanyPositioning:
      type: object
      properties:
        positionInChain:
          type: string
        functionalRole:
          type: string
        positionQuality:
          type: string
      required:
        - positionInChain
        - functionalRole
        - positionQuality

    AnalysisCompetitiveAdvantage:
      type: object
      properties:
        differentiation:
          type: string
        moat:
          type: string
        competitiveLandscape:
          type: string
      required:
        - differentiation
        - moat
        - competitiveLandscape

    AnalysisValueCapture:
      type: object
      properties:
        valueCapture:
          type: string
        revenueQuality:
          type: string
        warningSigns:
          type: string
      required:
        - valueCapture
        - revenueQuality
        - warningSigns

    AnalysisChainComparison:
      type: object
      properties:
        betterAlternatives:
          type: string
        relativePositioning:
          type: string
      required:
        - betterAlternatives
        - relativePositioning

    AnalysisForwardLooking:
      type: object
      properties:
        catalysts:
          type: string
        bullCase:
          type: string
        bearCase:
          type: string
        baseCase:
          type: string
        winConditions:
          type: string
      required:
        - catalysts
        - bullCase
        - bearCase
        - baseCase
        - winConditions

    AnalysisConclusion:
      type: object
      properties:
        classification:
          type: string
          enum: ["value_pool", "hype", "tactical", "value_trap"]
        classificationLabel:
          type: string
        reasoning:
          type: string
        actionableIdeas:
          type: string
      required:
        - classification
        - classificationLabel
        - reasoning
        - actionableIdeas

    AnalysisEvent:
      type: object
      properties:
        realityVsNarrative:
          type: string
        secondOrderThinking:
          type: string
        capitalFlow:
          type: string
        winners:
          type: string
        losers:
          type: string
        materiality:
          type: string
        actionableInsights:
          type: string
      required:
        - realityVsNarrative
        - secondOrderThinking
        - capitalFlow
        - winners
        - losers
        - materiality
        - actionableInsights

    AnalysisManagement:
      type: object
      properties:
        ceoProfile:
          type: string
        skinInGame:
          type: string
        trackRecord:
          type: string
      required:
        - ceoProfile
        - skinInGame
        - trackRecord

    AnalysisMarketSizing:
      type: object
      properties:
        tam:
          type: string
        cagr:
          type: string
        pricingPower:
          type: string
      required:
        - tam
        - cagr
        - pricingPower

    AnalysisFinancialDeepDive:
      type: object
      properties:
        roicVsWacc:
          type: string
        interestCoverageInsight:
          type: string
        capexQuality:
          type: string
        ebitdaToNetIncome:
          type: string
      required:
        - roicVsWacc
        - interestCoverageInsight
        - capexQuality
        - ebitdaToNetIncome

    AnalysisValuationDCF:
      type: object
      properties:
        bullDCF:
          type: string
        baseDCF:
          type: string
        bearDCF:
          type: string
        historicalMultiple:
          type: string
      required:
        - bullDCF
        - baseDCF
        - bearDCF
        - historicalMultiple

    AnalysisRiskMatrix:
      type: object
      properties:
        supplyChain:
          type: string
        preMortem:
          type: string
        thesisBreaker:
          type: string
      required:
        - supplyChain
        - preMortem
        - thesisBreaker

    SectorPerformanceItem:
      type: object
      properties:
        ticker:
          type: string
        name:
          type: string
        price:
          type: number
          nullable: true
        changePercent:
          type: number
          nullable: true
        change:
          type: number
          nullable: true
        volume:
          type: number
          nullable: true
        avgVolume:
          type: number
          nullable: true
        relativeVolume:
          type: number
          nullable: true
        fiftyTwoWeekHigh:
          type: number
          nullable: true
        fiftyTwoWeekLow:
          type: number
          nullable: true
        preMarketPrice:
          type: number
          nullable: true
        preMarketChangePercent:
          type: number
          nullable: true
        postMarketPrice:
          type: number
          nullable: true
        postMarketChangePercent:
          type: number
          nullable: true
        marketState:
          type: string
          nullable: true
      required:
        - ticker
        - name

    IndexItem:
      type: object
      properties:
        ticker:
          type: string
        name:
          type: string
        price:
          type: number
          nullable: true
        changePercent:
          type: number
          nullable: true
        change:
          type: number
          nullable: true
        preMarketPrice:
          type: number
          nullable: true
        preMarketChangePercent:
          type: number
          nullable: true
        postMarketPrice:
          type: number
          nullable: true
        postMarketChangePercent:
          type: number
          nullable: true
        marketState:
          type: string
          nullable: true
      required:
        - ticker
        - name

    FuturesItem:
      type: object
      properties:
        ticker:
          type: string
        name:
          type: string
        price:
          type: number
          nullable: true
        changePercent:
          type: number
          nullable: true
        change:
          type: number
          nullable: true
        preMarketChangePercent:
          type: number
          nullable: true
        marketState:
          type: string
          nullable: true
      required:
        - ticker
        - name

    InternationalItem:
      type: object
      properties:
        ticker:
          type: string
        name:
          type: string
        price:
          type: number
          nullable: true
        changePercent:
          type: number
          nullable: true
        change:
          type: number
          nullable: true
        marketState:
          type: string
          nullable: true
      required:
        - ticker
        - name

    CurrencyItem:
      type: object
      properties:
        ticker:
          type: string
        name:
          type: string
        price:
          type: number
          nullable: true
        changePercent:
          type: number
          nullable: true
        preMarketChangePercent:
          type: number
          nullable: true
        marketState:
          type: string
          nullable: true
      required:
        - ticker
        - name

    EconomicEvent:
      type: object
      properties:
        event:
          type: string
        country:
          type: string
        impact:
          type: string
          nullable: true
        actual:
          type: string
          nullable: true
        estimate:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        time:
          type: string
          nullable: true
      required:
        - event
        - country

    PremarketMover:
      type: object
      properties:
        ticker:
          type: string
        name:
          type: string
        sector:
          type: string
        price:
          type: number
          nullable: true
        changePercent:
          type: number
          nullable: true
        preMarketPrice:
          type: number
          nullable: true
        preMarketChangePercent:
          type: number
          nullable: true
        postMarketChangePercent:
          type: number
          nullable: true
        extendedChangePercent:
          type: number
          nullable: true
        marketState:
          type: string
          nullable: true
      required:
        - ticker
        - name
        - sector

    ImpliedSectorRotation:
      type: object
      properties:
        sector:
          type: string
        avgPrePct:
          type: number
        stocks:
          type: array
          items:
            type: string
      required:
        - sector
        - avgPrePct
        - stocks

    MarketPulseAnalysis:
      type: object
      properties:
        marketPosture:
          type: string
        premarketOutlook:
          type: string
        sectorRotation:
          type: string
        capitalFlow:
          type: string
        keyThemes:
          type: string
        topSectors:
          type: string
        weakSectors:
          type: string
        macroImpact:
          type: string
        risks:
          type: string
        tradingDayPrep:
          type: string
        actionableInsights:
          type: string
      required:
        - marketPosture
        - premarketOutlook
        - sectorRotation
        - capitalFlow
        - keyThemes
        - topSectors
        - weakSectors
        - macroImpact
        - risks
        - tradingDayPrep
        - actionableInsights

    MarketDailyReport:
      type: object
      properties:
        generatedAt:
          type: string
        marketState:
          type: string
          nullable: true
        fearLabel:
          type: string
          nullable: true
        vixLevel:
          type: number
          nullable: true
        sectorPerformance:
          type: array
          items:
            $ref: "#/components/schemas/SectorPerformanceItem"
        indices:
          type: array
          items:
            $ref: "#/components/schemas/IndexItem"
        futures:
          type: array
          items:
            $ref: "#/components/schemas/FuturesItem"
        international:
          type: array
          items:
            $ref: "#/components/schemas/InternationalItem"
        currencies:
          type: array
          items:
            $ref: "#/components/schemas/CurrencyItem"
        economicEvents:
          type: array
          items:
            $ref: "#/components/schemas/EconomicEvent"
        premarketMovers:
          type: array
          items:
            $ref: "#/components/schemas/PremarketMover"
        topPreMarketGainers:
          type: array
          items:
            $ref: "#/components/schemas/PremarketMover"
        topPreMarketLosers:
          type: array
          items:
            $ref: "#/components/schemas/PremarketMover"
        impliedSectorRotation:
          type: array
          items:
            $ref: "#/components/schemas/ImpliedSectorRotation"
        marketPulse:
          $ref: "#/components/schemas/MarketPulseAnalysis"
      required:
        - generatedAt
        - sectorPerformance
        - indices
        - futures
        - international
        - currencies
        - economicEvents
        - premarketMovers
        - topPreMarketGainers
        - topPreMarketLosers
        - impliedSectorRotation
        - marketPulse

    DailyAnalysis:
      type: object
      properties:
        ticker:
          type: string
        companyName:
          type: string
        marketState:
          type: string
          nullable: true
        dailyMetrics:
          $ref: "#/components/schemas/DailyMetrics"
        technicalOutlook:
          $ref: "#/components/schemas/TechnicalOutlook"
          nullable: true
        recentNews:
          type: array
          items:
            $ref: "#/components/schemas/NewsItem"
        sigDevs:
          type: array
          items:
            $ref: "#/components/schemas/SigDev"
        analystSummary:
          $ref: "#/components/schemas/AnalystSummary"
        aiAnalysis:
          $ref: "#/components/schemas/DailyAiAnalysis"
        generatedAt:
          type: string
      required:
        - ticker
        - companyName
        - dailyMetrics
        - recentNews
        - sigDevs
        - analystSummary
        - aiAnalysis
        - generatedAt

    DailyMetrics:
      type: object
      properties:
        price:
          type: number
        priceChangePercent:
          type: number
        volume:
          type: number
          nullable: true
        avgVolume10d:
          type: number
          nullable: true
        volumeRatio:
          type: number
          nullable: true
        dayLow:
          type: number
          nullable: true
        dayHigh:
          type: number
          nullable: true
        pricePositionInRange:
          type: number
          nullable: true
        shortPercentOfFloat:
          type: number
          nullable: true
        shortRatio:
          type: number
          nullable: true
        fiftyTwoWeekChangePercent:
          type: number
          nullable: true
      required:
        - price
        - priceChangePercent

    TechnicalOutlook:
      type: object
      properties:
        direction:
          type: string
        stateDescription:
          type: string
        score:
          type: number
          nullable: true
      required:
        - direction
        - stateDescription

    NewsItem:
      type: object
      properties:
        title:
          type: string
        publisher:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        publishedAt:
          type: string
          nullable: true
      required:
        - title

    SigDev:
      type: object
      properties:
        headline:
